name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Install server deps
        working-directory: server
        run: npm ci

      - name: Install extension deps
        working-directory: extension
        run: npm ci

      - name: Build server
        working-directory: server
        run: npm run build

      - name: Build extension
        working-directory: extension
        run: npm run build

      - name: Typecheck extension
        working-directory: extension
        run: npm run typecheck

      - name: Source-map test
        working-directory: server
        run: npm run test:sourcemap

      - name: End-to-end MCP test
        working-directory: server
        run: npm run test:e2e
